[project]
name = "voight"
version = "0.2.0"
description = "Herramientas para gestionar preguntas de Moodle (GIFT, XML)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "python-dotenv",
    "typer>=0.12.0",
    "click>=8.0.0",
    "rich>=13.0,<14.0",
    # Núcleo común del ecosistema (N-ECO-14): contrato de línea de comandos y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@6f95ad93c661adb4493414c6cc57534a18e8f2e0",
]

[project.scripts]
voight = "voight.cli:main"

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN/voight"
Repository = "https://github.com/INGCOM-UNRN/voight.git"
Issues = "https://github.com/INGCOM-UNRN/voight/issues"

[project.optional-dependencies]
# `voight ai` (Gemini o Claude). Es opcional: los SDK arrastran muchas
# dependencias (cryptography, urllib3, pyasn1, httpx2, …) que el resto del CLI no usa.
ai = [
    "google-genai>=2.4.0",
    "anthropic>=1.11.0",
]
ui = [
    "flask>=3.0",
    "markdown",
]
# Interfaz de terminal para revisar duplicados (`voight dedup --tui`).
tui = [
    "textual>=6.0",
]

# Certificar el código C de las preguntas (`voight health validate --compilar`, Ola 14).
compilar = [
    "daedalus @ git+https://github.com/INGCOM-UNRN-P1/daedalus@2f98e3974baa3ced1293739bf08a858ef81d6104",
]

# Revisión ortográfica con LanguageTool (delegada en myst-tools).
languagetool = [
    "myst-tools @ git+https://github.com/martinvilu/mystmd-tools@a55f7db83b03aa1da9485b3cf70c49b71ece2664",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voight"]

[tool.pytest.ini_options]
addopts = "-rs"
testpaths = ["tests"]

[tool.coverage.run]
source = ["voight"]

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true

[tool.mypy]
# Chequeo de tipos del núcleo (src/voight/core): `uvx mypy`. Las dependencias
# opcionales (google-genai, anthropic, textual…) no siempre están instaladas.
python_version = "3.11"
files = ["src/voight/core"]
ignore_missing_imports = true
