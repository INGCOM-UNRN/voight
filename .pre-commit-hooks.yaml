# Hooks de pre-commit para los repositorios de bancos de preguntas.
# Uso, en el .pre-commit-config.yaml del banco:
#
#   repos:
#     - repo: https://github.com/INGCOM-UNRN/voight
#       rev: <tag o commit>
#       hooks:
#         - id: voight-format
#         - id: voight-health
#
# Todos reciben sólo los archivos .gift/.xml del commit.

- id: voight-format
  name: formato estándar de GIFT y Moodle XML
  description: Falla si algún archivo no tiene el formato estándar (voight fix format lo corrige).
  entry: voight fix format --check
  language: python
  files: \.(gift|xml)$

- id: voight-health
  name: salud del banco (errores)
  description: Falla ante errores que Moodle no importaría o importaría mal (porcentajes, preguntas partidas, código que rompe GIFT).
  entry: voight health --max-items 20
  language: python
  files: \.(gift|xml)$

- id: voight-health-estricto
  name: salud del banco (errores y advertencias)
  description: Como voight-health, pero también falla ante advertencias (feedback, opciones, longitud de las respuestas).
  entry: voight health --estricto --max-items 20
  language: python
  files: \.(gift|xml)$

# Nombre anterior: `health validate` ahora es `health`, así que es igual a voight-health.
- id: voight-validate
  name: validación de GIFT y Moodle XML (igual a voight-health)
  description: Falla si algún archivo no se puede interpretar o tiene preguntas sin respuesta correcta o vacías.
  entry: voight health --max-items 20
  language: python
  files: \.(gift|xml)$
